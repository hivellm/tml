[package]
name = "ir-diff"
version = "0.1.0"
edition = "2025"
authors = ["TML Team"]
description = "LLVM IR semantic diff tool for TML self-hosting verification"
license = "Apache-2.0"
repository = "https://github.com/hivellm/tml"
homepage = "https://tml-lang.org"
keywords = ["ir", "diff", "compiler", "testing", "self-hosting"]
categories = ["development-tools"]

[lib]
name = "ir_diff"
path = "src/mod.tml"

[[bin]]
name = "ir-diff"
path = "src/main.tml"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
