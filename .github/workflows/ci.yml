name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

env:
  BUILD_TYPE: Debug

jobs:
  # Format check
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C/C++ formatting
        run: |
          NEEDS_FORMAT=false
          for file in $(find compiler/src compiler/runtime compiler/include -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" 2>/dev/null); do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              echo "Needs formatting: $file"
              NEEDS_FORMAT=true
            fi
          done
          if [ "$NEEDS_FORMAT" = true ]; then
            echo "Some files need formatting. Run clang-format locally."
            exit 1
          fi
          echo "All files are properly formatted"

  # Lint check - builds TML compiler and uses `tml lint`
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm libssl-dev

      - name: Build TML Compiler
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh --ci

      - name: Run TML Lint
        continue-on-error: true
        run: |
          TML_EXE=$(find build -name "tml" -type f | head -1)
          if [ -n "$TML_EXE" ]; then
            chmod +x "$TML_EXE"
            echo "Using TML compiler: $TML_EXE"
            "$TML_EXE" lint lib || echo "Lint check requires full compiler build"
          else
            echo "Compiler not found - skipping lint"
          fi

      - name: Run clang-tidy (C++ lint)
        continue-on-error: true
        run: |
          INCLUDE_ARGS="-I compiler/include -I compiler/src"
          FILES=$(find compiler/src -name "*.cpp" | head -10)
          for file in $FILES; do
            echo "Checking: $file"
            clang-tidy "$file" -- -std=c++17 $INCLUDE_ARGS 2>/dev/null || true
          done

  # Build and test on multiple platforms
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh --ci

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: scripts\build.bat --ci

      - name: Upload Compiler Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tml-${{ matrix.os }}
          path: |
            build/debug/bin/tml
            build/debug/bin/tml.exe
          if-no-files-found: ignore

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cpp-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore

  # TML integration tests are disabled in CI mode (requires full LLVM-enabled build)
  # test-tml:
  #   name: TML Tests
  #   needs: build-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #     - name: Download TML Compiler
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: tml-ubuntu-latest
  #         path: build/debug/bin
  #     - name: Run TML Tests
  #       run: |
  #         TML_EXE="build/debug/bin/tml"
  #         chmod +x "$TML_EXE"
  #         "$TML_EXE" test compiler/tests lib/core/tests lib/std/tests

  # Spell check
  codespell:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Codespell
        run: python -m pip install --upgrade 'codespell[toml]'

      - name: Run Codespell
        run: |
          codespell \
            --skip="*.lock,*.json,*.map,*.yaml,*.yml,*.csv,*.bib,*.md,target,node_modules,.git,dist,venv,build,benchmarks,coverage,*.ll,*.bc,*.o,*.obj,*.exe,docs,rulebook,.sandbox,backup,src/gcc,src/llvm-project,compiler/third_party,compiler/cranelift" \
            --ignore-words-list="crate,ser,deser,upToDate,optIn,shouldBe,Bloc,strbuilder,LPAR,RPAR,LBRACE,RBRACE,LBRACKET,RBRACKET,inout,olt,ogt,oge,ole,oeq,une,statics,inferrable,implementors,SEH,PassT,clos,hel,fo,bu,Nd,nd,te,aNULL,ShiftIn,Implementor,OtherWrite,Strng,caf"
