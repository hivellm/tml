[package]
name = "postgresql"
version = "0.1.0"
edition = "2025"
authors = ["TML Team"]
description = "PostgreSQL driver for TML database abstraction layer"
license = "Apache-2.0"
repository = "https://github.com/hivellm/tml"
homepage = "https://tml-lang.org"
keywords = ["database", "postgresql", "postgres", "driver"]
categories = ["database"]

[lib]
name = "postgresql"
path = "src/mod.tml"

[native-deps]
libpq = { lib = "libpq", version = "16.0", headers = ["libpq-fe.h"] }

[native-deps.libpq.win-x64]
runtime = ["libpq.dll", "libcrypto-3-x64.dll", "libssl-3-x64.dll", "libiconv-2.dll", "libintl-9.dll"]
link = ["libpq.lib"]
source = "native/win-x64"

[native-deps.libpq.linux-x64]
runtime = ["libpq.so.5"]
link = ["libpq.so"]
source = "native/linux-x64"

[native-deps.libpq.macos-arm64]
runtime = ["libpq.5.dylib"]
link = ["libpq.dylib"]
source = "native/macos-arm64"

[features]
default = []

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
